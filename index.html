<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Alerts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4f6f9;
    --surface: #ffffff;
    --ink: #14213d;
    --muted: #5b6577;
    --line: #dde2ea;
    --exploited: #b3261e;
    --critical: #c2410c;
    --high: #a16207;
    --info: #3f5f8f;
    --action: #14213d;
    --action-ink: #ffffff;
    --focus: #2563eb;
    --tint-exploited: #fbeae8;
    --tint-action: #eef3fb;
    --radius: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0e1626;
      --surface: #16213a;
      --ink: #e7ecf5;
      --muted: #9aa6bb;
      --line: #2a3754;
      --exploited: #ff8a80;
      --critical: #fb923c;
      --high: #facc15;
      --info: #93b4e6;
      --action: #e7ecf5;
      --action-ink: #0e1626;
      --focus: #93c5fd;
      --tint-exploited: #3a1b1d;
      --tint-action: #1d2b4a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 400 16px/1.5 "Public Sans", system-ui, sans-serif; }
  .time, .count { font-variant-numeric: tabular-nums; }
  a { color: inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 2px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  /* header */
  .top { border-bottom: 1px solid var(--line); background: var(--surface); }
  .top .wrap { display: flex; align-items: baseline; gap: 16px; padding-top: 14px; padding-bottom: 14px; flex-wrap: wrap; }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: -0.01em; text-decoration: none; }
  .tagline { color: var(--muted); font-size: 14px; }

  /* the one loud element: the latest exploited alert, set like an official warning notice */
  .notice { margin: 28px 0 8px; border-left: 8px solid var(--exploited); background: var(--surface);
            padding: 20px 24px; border-radius: 0 var(--radius) var(--radius) 0; }
  .notice.calm { border-left-color: var(--info); }
  .notice-kicker { color: var(--exploited); font-weight: 600; font-size: 15px; margin: 0 0 6px; }
  .notice.calm .notice-kicker { color: var(--info); }
  .notice h1 { font-size: clamp(24px, 3.2vw, 36px); line-height: 1.15; font-weight: 800; letter-spacing: -0.02em;
               margin: 0 0 10px; max-width: 30ch; }
  .notice h1 a { text-decoration: none; }
  .notice h1 a:hover { text-decoration: underline; text-decoration-thickness: 2px; }
  .notice .meta { color: var(--muted); font-size: 14px; }
  .notice .todo { margin-top: 12px; max-width: 70ch; }

  /* layout */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 32px; margin: 24px 0 64px; align-items: start; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .signup { order: -1; position: static !important; }
  }
  h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }

  /* summary strip: last 7 days at a glance, each number is a shortcut filter */
  .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 0 0 16px; }
  .stat { font: inherit; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 10px 12px; cursor: pointer; color: var(--ink); }
  .stat:hover { border-color: var(--muted); }
  .stat b { display: block; font-size: 22px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .stat.exploited b { color: var(--exploited); } .stat.critical b { color: var(--critical); } .stat.high b { color: var(--high); }
  .stat.zero b { color: var(--muted); }
  @media (max-width: 520px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* view tabs */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tabs button { font: inherit; font-size: 15px; background: none; border: 0; color: var(--muted); padding: 8px 12px 9px;
                 cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .tabs .n { font-size: 12px; color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }

  /* filter bar: stays on screen while scrolling the list */
  .filterbar { position: sticky; top: 0; z-index: 5; background: var(--paper); padding: 10px 0 8px; }
  .bar-top { display: flex; gap: 8px; }
  .filter-panel { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
  .toggle-filters { display: none; }
  @media (max-width: 700px) {
    .toggle-filters { display: inline-block; }
    .filter-panel[data-open="false"] { display: none; }
  }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
          border-radius: 999px; padding: 5px 12px; cursor: pointer; min-height: 34px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
  .chip .n { opacity: .7; font-size: 12px; margin-left: 3px; font-variant-numeric: tabular-nums; }
  select, input[type="search"], input[type="email"] {
    font: inherit; font-size: 15px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; min-height: 38px;
  }
  input[type="search"] { flex: 1 1 200px; min-width: 0; }
  .ghost { font: inherit; font-size: 15px; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
           border-radius: var(--radius); padding: 7px 12px; cursor: pointer; min-height: 38px; }
  /* multi-select dropdowns (technology, threat type) */
  .multi { position: relative; margin: 0; font-size: 15px; }
  .multi > summary { list-style: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
                     border-radius: var(--radius); padding: 7px 12px; min-height: 38px; cursor: pointer; white-space: nowrap; }
  .multi > summary::-webkit-details-marker { display: none; }
  .multi > summary::after { content: " ▾"; color: var(--muted); }
  .multi[data-on="true"] > summary { border-color: var(--ink); font-weight: 600; }
  .multi .menu { position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; min-width: 240px; max-height: 320px; overflow: auto;
                 background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px;
                 box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  .multi .menu .check { white-space: nowrap; }
  .active { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; }
  .active[hidden] { display: none; }
  .pill { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--tint-action); color: var(--ink);
          border-radius: 999px; padding: 2px 4px 2px 10px; cursor: pointer; }
  .pill::after { content: "×"; margin-left: 6px; padding: 0 4px; color: var(--muted); }
  .linkish { font: inherit; font-size: 13px; background: none; border: 0; color: var(--focus); cursor: pointer; text-decoration: underline; padding: 2px 4px; }
  .count { color: var(--muted); font-size: 13px; margin: 6px 0 0; font-variant-numeric: tabular-nums; }

  /* feed: compact rows, details on demand */
  .day { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 0; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .item { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .time { color: var(--muted); font-size: 12px; padding-top: 2px; white-space: nowrap; line-height: 1.35; font-variant-numeric: tabular-nums; }
  .time .date { display: block; color: var(--ink); font-weight: 600; }
  .line1 { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  .sev { font-size: 12px; font-weight: 700; white-space: nowrap; text-transform: uppercase; letter-spacing: .02em; }
  .sev.exploited { color: var(--exploited); }
  .sev.critical { color: var(--critical); }
  .sev.high { color: var(--high); }
  .sev.info { color: var(--info); }
  .item .title { font-weight: 600; font-size: 15px; line-height: 1.35; text-decoration: none; min-width: 0;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .title:hover { text-decoration: underline; }
  .item .src { color: var(--muted); font-size: 13px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more-btn { font: inherit; font-size: 13px; background: none; border: 1px solid var(--line); border-radius: var(--radius);
              color: var(--muted); padding: 3px 8px; cursor: pointer; white-space: nowrap; }
  .more-btn[aria-expanded="true"] { color: var(--ink); border-color: var(--muted); }
  .detail { grid-column: 2 / -1; font-size: 14px; }
  .detail[hidden] { display: none; }
  .detail p { margin: 4px 0 8px; color: var(--muted); }
  @media (max-width: 520px) {
    .item { grid-template-columns: 56px minmax(0, 1fr); gap: 8px; }
    .item .more-btn { grid-column: 2; justify-self: start; }
    .item .title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .line1 { display: block; } .line1 .sev { margin-right: 6px; }
  }
  .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  details { font-size: 14px; }
  .todo { background: var(--tint-action); border-radius: var(--radius); padding: 10px 12px; font-size: 14px; margin-top: 6px; }
  .todo ul { margin: 6px 0 0 18px; padding: 0; }
  .item.exploited { box-shadow: inset 3px 0 0 var(--exploited); padding-left: 10px; margin-left: -10px; }
  .empty { padding: 32px 0; color: var(--muted); }
  .show-more { display: block; margin: 16px auto 0; }
  .show-more[hidden] { display: none; }
  #source { max-width: 220px; }

  /* sign-up card */
  .signup { position: sticky; top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  label.field { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
  .signup input[type="email"] { width: 100%; }
  fieldset { border: 0; padding: 0; margin: 16px 0 0; }
  legend { font-weight: 600; font-size: 14px; padding: 0; margin-bottom: 6px; }
  .check, .radio { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; padding: 4px 0; cursor: pointer; }
  .check input, .radio input { margin-top: 3px; accent-color: var(--ink); width: 16px; height: 16px; flex: none; }
  .hint { color: var(--muted); font-size: 13px; }
  .topic-group { margin-top: 8px; }
  .topic-group h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 10px 0 2px; }
  .topic-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; }
  @media (max-width: 420px) { .topic-grid { grid-template-columns: 1fr; } }
  .topics[hidden] { display: none; }
  .btn { display: inline-block; font: inherit; font-weight: 600; font-size: 15px; border-radius: var(--radius); padding: 10px 18px;
         border: 1px solid var(--action); background: var(--action); color: var(--action-ink); cursor: pointer; margin-top: 18px; }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.danger { background: transparent; color: var(--exploited); border-color: var(--line); }
  .status { margin-top: 12px; font-size: 14px; min-height: 1.5em; }
  .status.ok { color: #15803d; }
  .status.err { color: var(--exploited); }
  @media (prefers-color-scheme: dark) { .status.ok { color: #86efac; } }
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }

  /* confirm & manage pages */
  .panel { max-width: 560px; margin: 48px auto 80px; background: var(--surface); border: 1px solid var(--line);
           border-radius: var(--radius); padding: 28px; }
  .panel h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .loading { color: var(--muted); padding: 24px 0; }
  @media (prefers-reduced-motion: no-preference) {
    .notice { animation: arrive .5s ease-out both; }
    @keyframes arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<script>
var BOOT = (function () {
  var q = new URLSearchParams(location.search);
  var page = q.get('page');
  var token = q.get('t') || '';
  return {
    api: "https://script.google.com/macros/s/AKfycbwnIn2sPLFUHUITU4iX6WfxCaJC0NTt4HF6HfTirqkXyBAOqjnRhI11cUmqcfeB_nmFKQ/exec",
    siteName: "Security Alerts",
    url: location.origin + location.pathname,
    page: ['confirm', 'manage'].indexOf(page) >= 0 ? page : 'home',
    token: /^[A-Za-z0-9]{16,80}$/.test(token) ? token : ''
  };
})();
</script>

<header class="top">
  <div class="wrap">
    <a class="brand" id="brand" href="#"></a>
    <span class="tagline">Vulnerabilities and attacks from CISA, NVD, GitHub, NCSC Ireland, vendors and security news. Checked every 30 minutes.</span>
  </div>
</header>

<main class="wrap" id="app"><p class="loading">Loading…</p></main>

<template id="tpl-home">
  <section class="notice calm" id="notice" aria-live="polite"></section>
  <div class="layout">
    <section aria-labelledby="feed-h">
      <h2 id="feed-h">Recent alerts</h2>
      <p class="sub">The last 30 days. Times are in your time zone.</p>
      <div class="summary" id="summary" aria-label="Last 7 days"></div>
      <div class="tabs" role="tablist" id="views" aria-label="Kind of alert"></div>
      <div class="filterbar" id="filterbar">
        <div class="bar-top">
          <input type="search" id="q" placeholder="Search titles, products or CVE numbers" aria-label="Search alerts">
          <button type="button" class="ghost toggle-filters" id="toggle-filters" aria-expanded="false" aria-controls="filter-panel">Filters</button>
        </div>
        <div class="filter-panel" id="filter-panel" data-open="false" role="group" aria-label="Filter alerts">
          <div class="chips" id="sev" role="group" aria-label="Severity"></div>
          <details class="multi" id="tech"><summary>Technology</summary><div class="menu"></div></details>
          <details class="multi" id="threat"><summary>Threat type</summary><div class="menu"></div></details>
          <select id="source" aria-label="Source"><option value="">All sources</option></select>
          <select id="range" aria-label="Date">
            <option value="">All dates</option>
            <option value="0">Today</option>
            <option value="1">Yesterday</option>
            <option value="7">Last 7 days</option>
            <option value="30">Last 30 days</option>
          </select>
          <select id="sort" aria-label="Sort">
            <option value="new">Newest first</option>
            <option value="serious">Most serious first</option>
          </select>
        </div>
        <div class="active" id="active" hidden></div>
        <p class="count" id="count" aria-live="polite"></p>
      </div>
      <div id="feed"></div>
      <button type="button" class="btn secondary show-more" id="show-more" hidden></button>
    </section>

    <aside class="signup" aria-labelledby="signup-h">
      <h2 id="signup-h">Get these by email</h2>
      <p class="sub">One email a day at about 12:00 IST, with anything urgent at the top.</p>
      <form id="signup-form" novalidate>
        <label class="field" for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required placeholder="name@example.com">
        <div class="hp" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
        <div data-choices></div>
        <button class="btn" type="submit">Subscribe</button>
        <p class="status" role="status" aria-live="polite"></p>
      </form>
    </aside>
  </div>
</template>

<template id="tpl-choices">
  <fieldset>
    <legend>Topics</legend>
    <label class="check"><input type="checkbox" name="all" checked><span>Everything<br><span class="hint">Every technology and threat type. Untick to pick specific ones.</span></span></label>
    <div class="topics" hidden>
      <div class="topic-group"><h3>Technologies</h3><div class="topic-grid" data-group="technologies"></div></div>
      <div class="topic-group"><h3>Threat types</h3><div class="topic-grid" data-group="threats"></div></div>
    </div>
  </fieldset>
</template>

<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var brand = document.getElementById('brand');
  brand.textContent = BOOT.siteName;
  brand.href = BOOT.url || '#';
  document.title = BOOT.siteName;

  // ------------------------------------------------------------ helpers
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  // Talks to the Apps Script backend. Served by Apps Script itself: google.script.run.
  // Hosted elsewhere (GitHub Pages, BOOT.api set): a POST without cookies, so Google's
  // multi-account routing never gets involved; if the browser blocks that, JSONP instead.
  var ACTIONS = { getPortalData: 'portal', subscribe: 'subscribe', confirmSubscription: 'confirm',
                  getSubscription: 'get', updateSubscription: 'update', unsubscribe: 'unsubscribe' };
  function payload(fn, args) {
    if (fn === 'getPortalData') return {};
    if (fn === 'subscribe') return args[0];
    if (fn === 'updateSubscription') return { token: args[0], topics: args[1], frequency: args[2] };
    return { token: args[0] };
  }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!BOOT.api) {
      return new Promise(function (resolve, reject) {
        var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        runner[fn].apply(runner, args);
      });
    }
    var data = payload(fn, args);
    var body = JSON.stringify(Object.assign({ action: ACTIONS[fn] }, data));
    return fetch(BOOT.api, { method: 'POST', body: body, credentials: 'omit', redirect: 'follow',
                             headers: { 'Content-Type': 'text/plain;charset=utf-8' } })   // "simple" request: no CORS preflight
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .catch(function () { return jsonp(ACTIONS[fn], data); });
  }
  function jsonp(action, data) {
    return new Promise(function (resolve, reject) {
      var name = '__cb' + Date.now() + Math.floor(Math.random() * 1e6);
      var script = document.createElement('script');
      var timer = setTimeout(function () { done(); reject(new Error('the server did not answer')); }, 25000);
      function done() { clearTimeout(timer); delete window[name]; script.remove(); }
      window[name] = function (res) { done(); resolve(res); };
      script.onerror = function () { done(); reject(new Error('could not reach the server')); };
      script.src = BOOT.api + '?api=' + encodeURIComponent(action) + '&data=' +
        encodeURIComponent(JSON.stringify(data || {})) + '&callback=' + name;
      document.head.appendChild(script);
    });
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : null; }
  function link(text, href, cls) {
    var u = safeUrl(href);
    var a = el(u ? 'a' : 'span', { class: cls || '', text: text });
    if (u) { a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    return a;
  }
  function when(a) { var d = new Date(a.published || a.received_at); return isNaN(d) ? new Date(a.received_at) : d; }
  // Whole days between d and today, in the viewer's time zone (0 = today, 1 = yesterday).
  function daysAgo(d) {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var that = new Date(d); that.setHours(0, 0, 0, 0);
    return Math.round((today - that) / 864e5);
  }
  function dateShort(d) {   // "24 Oct", with the year if it isn't this year
    var opts = { day: 'numeric', month: 'short' };
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
    return d.toLocaleDateString(undefined, opts);
  }
  function dayLabel(d) {
    var full = d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    var diff = daysAgo(d);
    if (diff === 0) return 'Today · ' + full;
    if (diff === 1) return 'Yesterday · ' + full;
    return full;
  }
  function hhmm(d) {
    // date-only sources (CISA KEV) arrive as midnight UTC; don't invent a time for them
    if (d.getUTCHours() === 0 && d.getUTCMinutes() === 0 && d.getUTCSeconds() === 0) return '';
    return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }
  function ago(d) {
    var m = Math.round((Date.now() - d) / 6e4);
    if (m < 60) return m <= 1 ? 'just now' : m + ' minutes ago';
    var h = Math.round(m / 60);
    if (h < 48) return h + (h === 1 ? ' hour ago' : ' hours ago');
    return Math.round(h / 24) + ' days ago';
  }
  function sevInfo(a) {
    if (a.exploited) return { cls: 'exploited', text: 'Exploited' };
    var s = a.score ? ' ' + Number(a.score).toFixed(1) : '';
    if (a.severity === 'critical') return { cls: 'critical', text: 'Critical' + s };
    if (a.severity === 'high') return { cls: 'high', text: 'High' + s };
    return { cls: 'info', text: a.priority === 'urgent' ? 'Urgent' : 'News & advisories' };
  }
  function todoBox(a) {
    if (!a.action && !(a.remediation || []).length) return null;
    var box = el('div', { class: 'todo' }, [el('strong', { text: 'What to do: ' }), a.action || '']);
    if ((a.remediation || []).length) {
      box.appendChild(el('ul', {}, a.remediation.slice(0, 4).map(function (r) { return el('li', { text: r }); })));
    }
    return box;
  }
  function setStatus(node, ok, msg) { node.className = 'status ' + (ok ? 'ok' : 'err'); node.textContent = msg; }
  function errorText(err) { return 'Something went wrong (' + (err && err.message ? err.message : err) + '). Try again.'; }

  // ------------------------------------------------------------ topic picker (shared)
  function buildChoices(host, topics, selected, frequency) {
    host.appendChild(document.getElementById('tpl-choices').content.cloneNode(true));
    var all = host.querySelector('input[name="all"]');
    var box = host.querySelector('.topics');
    ['technologies', 'threats'].forEach(function (g) {
      var grid = host.querySelector('[data-group="' + g + '"]');
      (topics[g] || []).forEach(function (t) {
        var input = el('input', { type: 'checkbox', name: 'topic', value: t });
        if (selected.indexOf(t) >= 0) input.checked = true;
        grid.appendChild(el('label', { class: 'check' }, [input, el('span', { text: t })]));
      });
    });
    var everything = !selected.length || selected.indexOf('ALL') >= 0;
    all.checked = everything;
    box.hidden = everything;
    all.addEventListener('change', function () { box.hidden = all.checked; });
    return function read() {
      var chosen = all.checked ? ['ALL'] : Array.prototype.map.call(
        host.querySelectorAll('input[name="topic"]:checked'), function (i) { return i.value; });
      return { topics: chosen, frequency: 'digest' };   // everyone gets one daily email
    };
  }

  // ------------------------------------------------------------ home page
  // ------------------------------------------------------------ feed: kinds, severity, filters
  // Which tab an alert belongs to. News sites by name; anything with a CVE is a vulnerability;
  // the remaining official sources (CISA, Microsoft, AWS, Google Cloud, NCSC) are advisories.
  var NEWS_SOURCES = ['BleepingComputer', 'The Hacker News', 'SecurityWeek', 'Dark Reading'];
  var VULN_SOURCES = ['CISA KEV', 'NVD', 'GitHub Advisories'];
  function kindOf(a) {
    if (NEWS_SOURCES.indexOf(a.source) >= 0) return 'news';
    if (VULN_SOURCES.indexOf(a.source) >= 0 || (a.cves || []).length) return 'vuln';
    return 'adv';
  }
  function sevKey(a) {
    if (a.exploited) return 'exploited';
    if (a.severity === 'critical') return 'critical';
    if (a.severity === 'high') return 'high';
    return 'other';
  }
  function needsAction(a) { return a.exploited || a.priority === 'urgent' || a.severity === 'critical' || a.severity === 'high'; }
  var SEV_RANK = { exploited: 4, critical: 3, high: 2, other: 1 };
  var VIEWS = [
    { id: 'action', label: 'Needs action', test: needsAction },
    { id: 'vuln', label: 'Vulnerabilities', test: function (a) { return kindOf(a) === 'vuln'; } },
    { id: 'adv', label: 'Advisories', test: function (a) { return kindOf(a) === 'adv'; } },
    { id: 'news', label: 'News', test: function (a) { return kindOf(a) === 'news'; } },
    { id: 'all', label: 'All', test: function () { return true; } }
  ];
  var SEVS = [['exploited', 'Exploited'], ['critical', 'Critical'], ['high', 'High'], ['other', 'Other']];
  var PAGE = 50;
  var DEFAULTS = { view: 'action', sev: [], tech: [], threat: [], src: '', days: '', sort: 'new', q: '' };

  // Filters live in the page address (?view=vuln&tech=Linux…) so a view can be bookmarked or shared;
  // the browser also remembers the last one used.
  function readFilters() {
    var f = JSON.parse(JSON.stringify(DEFAULTS)), params;
    try { params = new URLSearchParams(location.search); } catch (e) { params = null; }
    var fromUrl = params && Object.keys(DEFAULTS).some(function (k) { return params.has(k); });
    if (fromUrl) {
      Object.keys(DEFAULTS).forEach(function (k) {
        if (!params.has(k)) return;
        f[k] = Array.isArray(DEFAULTS[k]) ? params.get(k).split(',').filter(String) : params.get(k);
      });
    } else {
      try { var saved = JSON.parse(localStorage.getItem('alertFilters') || 'null'); if (saved) Object.assign(f, saved); } catch (e) {}
    }
    if (!VIEWS.some(function (v) { return v.id === f.view; })) f.view = DEFAULTS.view;
    return f;
  }
  function saveFilters(f) {
    var params = new URLSearchParams();
    Object.keys(DEFAULTS).forEach(function (k) {
      var v = f[k], d = DEFAULTS[k];
      if (Array.isArray(v) ? v.length : (v !== d && v !== '')) params.set(k, Array.isArray(v) ? v.join(',') : v);
    });
    var qs = params.toString();
    try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash); } catch (e) {}
    try { localStorage.setItem('alertFilters', JSON.stringify(f)); } catch (e) {}
  }

  // ------------------------------------------------------------ home page
  function home() {
    app.innerHTML = '';
    app.appendChild(document.getElementById('tpl-home').content.cloneNode(true));
    var state = { alerts: [], f: readFilters(), limit: PAGE, open: {} };
    var $ = function (id) { return document.getElementById(id); };
    var feed = $('feed'), count = $('count'), notice = $('notice');
    var form = $('signup-form');
    var status = form.querySelector('.status');
    var readChoices = null;
    notice.appendChild(el('p', { class: 'notice-kicker', text: 'Loading the latest alerts…' }));

    // Every filter except the one named in `skip` (used for the counts shown on tabs and chips).
    function passes(a, skip) {
      var f = state.f;
      if (skip !== 'view' && !VIEWS.filter(function (v) { return v.id === f.view; })[0].test(a)) return false;
      if (skip !== 'sev' && f.sev.length && f.sev.indexOf(sevKey(a)) < 0) return false;
      if (f.tech.length && !f.tech.some(function (t) { return a.technologies.indexOf(t) >= 0; })) return false;
      if (f.threat.length && !f.threat.some(function (t) { return a.threat_types.indexOf(t) >= 0; })) return false;
      if (f.src && a.source !== f.src) return false;
      if (f.days !== '') {
        var n = daysAgo(when(a)), r = Number(f.days);
        if (r <= 1 ? n !== r : n >= r) return false;     // Today / Yesterday exactly; "last N days" includes today
      }
      var q = f.q.trim().toLowerCase();
      if (q) {
        if (/^cve-\d{4}-\d{4,}$/.test(q)) return (a.cves || []).some(function (c) { return c.toLowerCase() === q; });
        var hay = (a.title + ' ' + (a.cves || []).join(' ') + ' ' + a.source + ' ' + a.technologies.join(' ') + ' ' + (a.summary || '')).toLowerCase();
        if (!q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; })) return false;
      }
      return true;
    }

    function update(changes, keepLimit) {
      Object.assign(state.f, changes || {});
      if (!keepLimit) state.limit = PAGE;
      saveFilters(state.f);
      render();
    }

    function renderSummary() {
      var box = $('summary'); box.innerHTML = '';
      var week = state.alerts.filter(function (a) { return daysAgo(when(a)) < 7; });
      [['exploited', 'Exploited', function (a) { return a.exploited; }, { view: 'all', sev: ['exploited'] }],
       ['critical', 'Critical', function (a) { return sevKey(a) === 'critical'; }, { view: 'all', sev: ['critical'] }],
       ['high', 'High', function (a) { return sevKey(a) === 'high'; }, { view: 'all', sev: ['high'] }],
       ['news', 'News stories', function (a) { return kindOf(a) === 'news'; }, { view: 'news', sev: [] }]
      ].forEach(function (s) {
        var n = week.filter(s[2]).length;
        var b = el('button', { type: 'button', class: 'stat ' + s[0] + (n ? '' : ' zero'),
                               title: 'Show ' + s[1].toLowerCase() + ' from the last 7 days' },
                   [el('b', { text: String(n) }), el('span', { text: s[1] + ' · 7 days' })]);
        b.addEventListener('click', function () { update(Object.assign({ days: '7' }, s[3])); $('feed-h').scrollIntoView({ behavior: 'smooth' }); });
        box.appendChild(b);
      });
    }

    function renderControls() {
      var f = state.f;
      // tabs, with how many alerts each would show
      var tabs = $('views'); tabs.innerHTML = '';
      VIEWS.forEach(function (v) {
        var n = state.alerts.filter(function (a) { return v.test(a) && passes(a, 'view'); }).length;
        var b = el('button', { type: 'button', role: 'tab', 'aria-selected': String(f.view === v.id) },
                   [v.label, el('span', { class: 'n', text: String(n) })]);
        b.addEventListener('click', function () { update({ view: v.id }); });
        tabs.appendChild(b);
      });
      // severity chips
      var sev = $('sev'); sev.innerHTML = '';
      SEVS.forEach(function (s) {
        var n = state.alerts.filter(function (a) { return sevKey(a) === s[0] && passes(a, 'sev'); }).length;
        var on = f.sev.indexOf(s[0]) >= 0;
        var b = el('button', { type: 'button', class: 'chip', 'aria-pressed': String(on) }, [s[1], el('span', { class: 'n', text: String(n) })]);
        b.addEventListener('click', function () {
          update({ sev: on ? f.sev.filter(function (x) { return x !== s[0]; }) : f.sev.concat([s[0]]) });
        });
        sev.appendChild(b);
      });
      // dropdown labels and current values
      [['tech', 'Technology'], ['threat', 'Threat type']].forEach(function (m) {
        var d = $(m[0]), n = f[m[0]].length;
        d.querySelector('summary').textContent = m[1] + (n ? ' (' + n + ')' : '');
        d.setAttribute('data-on', String(n > 0));
        Array.prototype.forEach.call(d.querySelectorAll('input'), function (i) { i.checked = f[m[0]].indexOf(i.value) >= 0; });
      });
      $('source').value = f.src; $('range').value = f.days; $('sort').value = f.sort;
      if ($('q').value !== f.q) $('q').value = f.q;
      // active filters as removable pills
      var act = $('active'); act.innerHTML = '';
      var pills = [];
      f.sev.forEach(function (x) { pills.push([SEVS.filter(function (s) { return s[0] === x; })[0][1], { sev: f.sev.filter(function (y) { return y !== x; }) }]); });
      f.tech.forEach(function (x) { pills.push([x, { tech: f.tech.filter(function (y) { return y !== x; }) }]); });
      f.threat.forEach(function (x) { pills.push([x, { threat: f.threat.filter(function (y) { return y !== x; }) }]); });
      if (f.src) pills.push([f.src, { src: '' }]);
      if (f.days !== '') pills.push([$('range').selectedOptions[0].textContent, { days: '' }]);
      if (f.q) pills.push(['"' + f.q + '"', { q: '' }]);
      pills.forEach(function (p) {
        var b = el('button', { type: 'button', class: 'pill', 'aria-label': 'Remove filter ' + p[0], text: p[0] });
        b.addEventListener('click', function () { update(p[1]); });
        act.appendChild(b);
      });
      if (pills.length) {
        var clear = el('button', { type: 'button', class: 'linkish', text: 'Clear all' });
        clear.addEventListener('click', function () { update({ sev: [], tech: [], threat: [], src: '', days: '', q: '' }); });
        act.appendChild(clear);
      }
      act.hidden = !pills.length;
      $('toggle-filters').textContent = 'Filters' + (pills.length ? ' (' + pills.length + ')' : '');
    }

    function row(a) {
      var d = when(a), sev = sevInfo(a), id = a.id || a.url;
      var main = a.technologies[0] || a.threat_types.filter(function (t) { return t !== 'Actively exploited'; })[0] || '';
      var meta = [a.source, main, (a.cves || []).slice(0, 2).join(', ')].filter(String).join(' · ');
      var title = link(a.title, a.url, 'title'); title.title = a.title;
      var btn = el('button', { type: 'button', class: 'more-btn', 'aria-expanded': String(!!state.open[id]), text: state.open[id] ? 'Less' : 'Details' });
      var detail = el('div', { class: 'detail' });
      detail.hidden = !state.open[id];
      if (a.summary) detail.appendChild(el('p', { text: a.summary }));
      var tags = a.technologies.concat(a.threat_types.filter(function (t) { return t !== 'Actively exploited'; }));
      if ((a.cves || []).length > 2) tags = a.cves.slice(0, 6).concat(tags);
      if (tags.length) detail.appendChild(el('div', { class: 'tags' }, tags.map(function (t) { return el('span', { class: 'tag', text: t }); })));
      var todo = todoBox(a);
      if (todo) detail.appendChild(todo);
      if (!detail.childNodes.length) detail.appendChild(el('p', { text: 'No further details. Open the title for the full story.' }));
      btn.addEventListener('click', function () {
        state.open[id] = !state.open[id];
        detail.hidden = !state.open[id];
        btn.setAttribute('aria-expanded', String(state.open[id]));
        btn.textContent = state.open[id] ? 'Less' : 'Details';
      });
      return el('article', { class: 'item' + (a.exploited ? ' exploited' : '') }, [
        el('div', { class: 'time' }, [el('span', { class: 'date', text: dateShort(d) }), hhmm(d)]),
        el('div', {}, [
          el('div', { class: 'line1' }, [el('span', { class: 'sev ' + sev.cls, text: sev.text }), title]),
          el('div', { class: 'src', text: meta })
        ]),
        btn, detail
      ]);
    }

    function render() {
      renderControls();
      var f = state.f;
      var list = state.alerts.filter(function (a) { return passes(a); });
      if (f.sort === 'serious') {
        list.sort(function (a, b) {
          return (SEV_RANK[sevKey(b)] - SEV_RANK[sevKey(a)]) || ((b.score || 0) - (a.score || 0)) || (when(b) - when(a));
        });
      }
      feed.innerHTML = '';
      var shown = list.slice(0, state.limit);
      count.textContent = list.length ? (shown.length < list.length ? 'Showing ' + shown.length + ' of ' : '') +
        list.length + (list.length === 1 ? ' alert' : ' alerts') : '';
      var more = $('show-more');
      more.hidden = shown.length >= list.length;
      more.textContent = 'Show ' + Math.min(PAGE, list.length - shown.length) + ' more (' + (list.length - shown.length) + ' left)';
      if (!list.length) {
        if (!state.alerts.length) {
          feed.appendChild(el('p', { class: 'empty', text: 'No alerts yet. They appear here after the monitor\'s next run, within 30 minutes.' }));
          return;
        }
        var elsewhere = f.view !== 'all' && state.alerts.filter(function (a) { return passes(a, 'view'); }).length;
        var msg = el('p', { class: 'empty', text: 'No alerts match these filters. ' });
        if (elsewhere) {
          var go = el('button', { type: 'button', class: 'linkish', text: 'Show ' + elsewhere + ' match' + (elsewhere === 1 ? '' : 'es') + ' in All' });
          go.addEventListener('click', function () { update({ view: 'all' }); });
          msg.appendChild(go);
        } else {
          var clear = el('button', { type: 'button', class: 'linkish', text: 'Clear the filters' });
          clear.addEventListener('click', function () { update({ sev: [], tech: [], threat: [], src: '', days: '', q: '' }); });
          msg.appendChild(clear);
        }
        feed.appendChild(msg);
        return;
      }
      var lastDay = '';
      shown.forEach(function (a) {
        if (f.sort === 'new') {
          var day = dayLabel(when(a));
          if (day !== lastDay) { feed.appendChild(el('h3', { class: 'day', text: day })); lastDay = day; }
        }
        feed.appendChild(row(a));
      });
    }

    function renderNotice() {
      notice.innerHTML = '';
      var top = state.alerts.filter(function (a) { return a.exploited; })[0];
      if (!top) {
        notice.className = 'notice calm';
        notice.appendChild(el('p', { class: 'notice-kicker', text: 'No exploited vulnerabilities in the last 30 days' }));
        notice.appendChild(el('h1', { text: state.alerts.length ? 'Nothing is being actively attacked right now.' : 'Waiting for the first alerts.' }));
        return;
      }
      var d = when(top);
      notice.className = 'notice';
      notice.appendChild(el('p', { class: 'notice-kicker', text: 'Latest actively exploited vulnerability · ' + ago(d) }));
      notice.appendChild(el('h1', {}, [link(top.title, top.url)]));
      notice.appendChild(el('div', { class: 'meta', text: top.source + ((top.cves || []).length ? ' · ' + top.cves.join(', ') : '') +
        (top.technologies.length ? ' · ' + top.technologies.join(', ') : '') }));
      var todo = todoBox(top);
      if (todo) notice.appendChild(el('div', { class: 'todo' }, Array.prototype.slice.call(todo.childNodes)));
    }

    // Filling the dropdowns once the data (topic and source names) has arrived.
    function buildFilterOptions(topics) {
      [['tech', topics.technologies], ['threat', topics.threats]].forEach(function (m) {
        var menu = $(m[0]).querySelector('.menu');
        (m[1] || []).forEach(function (t) {
          var input = el('input', { type: 'checkbox', value: t });
          input.addEventListener('change', function () {
            var cur = state.f[m[0]];
            var change = {};
            change[m[0]] = input.checked ? cur.concat([t]) : cur.filter(function (x) { return x !== t; });
            update(change);
          });
          menu.appendChild(el('label', { class: 'check' }, [input, el('span', { text: t })]));
        });
      });
      var counts = {};
      state.alerts.forEach(function (a) { counts[a.source] = (counts[a.source] || 0) + 1; });
      Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).forEach(function (src) {
        $('source').appendChild(el('option', { value: src, text: src + ' (' + counts[src] + ')' }));
      });
    }

    // close an open dropdown when clicking elsewhere
    document.addEventListener('click', function (e) {
      Array.prototype.forEach.call(document.querySelectorAll('.multi[open]'), function (d) { if (!d.contains(e.target)) d.open = false; });
    });
    $('source').addEventListener('change', function (e) { update({ src: e.target.value }); });
    $('range').addEventListener('change', function (e) { update({ days: e.target.value }); });
    $('sort').addEventListener('change', function (e) { update({ sort: e.target.value }); });
    var typing;
    $('q').addEventListener('input', function (e) {
      clearTimeout(typing);
      typing = setTimeout(function () { update({ q: e.target.value }); }, 150);
    });
    $('show-more').addEventListener('click', function () { state.limit += PAGE; render(); });
    $('toggle-filters').addEventListener('click', function () {
      var panel = $('filter-panel'), open = panel.getAttribute('data-open') !== 'true';
      panel.setAttribute('data-open', String(open));
      this.setAttribute('aria-expanded', String(open));
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = form.email.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setStatus(status, false, 'Enter a valid email address, like name@example.com.'); form.email.focus(); return; }
      var c = readChoices();
      if (!c.topics.length) { setStatus(status, false, 'Choose at least one topic, or tick "Everything".'); return; }
      var btn = form.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = 'Subscribing…';
      call('subscribe', { email: email, topics: c.topics, frequency: c.frequency, website: form.website.value })
        .then(function (res) {
          setStatus(status, res.ok, res.message);
          if (res.ok) form.email.value = '';
        })
        .catch(function (err) { setStatus(status, false, errorText(err)); })
        .then(function () { btn.disabled = false; btn.textContent = 'Subscribe'; });
    });

    call('getPortalData').then(function (data) {
      state.alerts = (data.alerts || []).map(function (a) {
        a.technologies = a.technologies || []; a.threat_types = a.threat_types || []; return a;
      });
      buildFilterOptions(data.topics);
      readChoices = buildChoices(form.querySelector('[data-choices]'), data.topics, [], 'both');
      renderNotice();
      renderSummary();
      render();
    }).catch(function (err) {
      notice.innerHTML = '';
      notice.appendChild(el('p', { class: 'notice-kicker', text: errorText(err) }));
    });
  }

  // ------------------------------------------------------------ confirm page
  function confirmPage() {
    app.innerHTML = '';
    var status = el('p', { class: 'status', role: 'status', 'aria-live': 'polite' });
    var btn = el('button', { class: 'btn', type: 'button', text: 'Confirm subscription' });
    var intro = el('p', { text: 'Confirm to start getting security alerts by email. You can change topics or unsubscribe at any time from the link in every email.' });
    var panel = el('section', { class: 'panel' }, [el('h1', { text: 'Confirm your subscription' }), intro, btn, status]);
    app.appendChild(panel);
    btn.addEventListener('click', function () {
      btn.disabled = true; btn.textContent = 'Confirming…';
      call('confirmSubscription', BOOT.token).then(function (res) {
        if (res.ok) {
          // Done: just the confirmation, no further buttons.
          btn.remove();
          status.remove();
          panel.querySelector('h1').textContent = 'Subscription confirmed';
          intro.textContent = (/first report/.test(res.message) ? 'Your first report is on its way and should arrive within a few minutes (check your spam folder if you don\'t see it). ' : '') +
            'After that, you will get one email a day at about 12:00 IST. Every email has a link to change your topics or unsubscribe.';
        } else {
          setStatus(status, false, res.message);
          btn.disabled = false; btn.textContent = 'Confirm subscription';
        }
      }).catch(function (err) { setStatus(status, false, errorText(err)); btn.disabled = false; btn.textContent = 'Confirm subscription'; });
    });
  }

  // ------------------------------------------------------------ manage page
  function managePage() {
    app.innerHTML = '';
    var panel = el('section', { class: 'panel' }, [el('p', { class: 'loading', text: 'Loading your subscription…' })]);
    app.appendChild(panel);
    call('getSubscription', BOOT.token).then(function (sub) {
      panel.innerHTML = '';
      if (!sub.ok) {
        panel.appendChild(el('h1', { text: 'Link not valid' }));
        panel.appendChild(el('p', { text: sub.message + ' Use the link from your most recent alert email.' }));
        return;
      }
      var status = el('p', { class: 'status', role: 'status', 'aria-live': 'polite' });
      var intro = sub.status === 'unsubscribed'
        ? 'You are unsubscribed. Choose your topics and save to start getting emails again.'
        : sub.status === 'pending' ? 'Your subscription is waiting for confirmation. Use the link in the confirmation email.'
        : 'Choose what you get. Changes apply from the next email.';
      var choices = el('div');
      var save = el('button', { class: 'btn', type: 'button', text: sub.status === 'unsubscribed' ? 'Subscribe again' : 'Save changes' });
      var unsub = el('button', { class: 'btn danger', type: 'button', text: 'Unsubscribe' });
      var row = el('div', { class: 'row' }, [save]);
      if (sub.status === 'active') row.appendChild(unsub);
      panel.appendChild(el('h1', { text: 'Your subscription' }));
      panel.appendChild(el('p', { class: 'sub', text: sub.email }));
      panel.appendChild(el('p', { text: intro }));
      panel.appendChild(choices);
      panel.appendChild(row);
      panel.appendChild(status);
      var read = buildChoices(choices, sub.allTopics, sub.topics, sub.frequency);

      save.addEventListener('click', function () {
        var c = read();
        if (!c.topics.length) { setStatus(status, false, 'Choose at least one topic, or tick "Everything".'); return; }
        save.disabled = true;
        call('updateSubscription', BOOT.token, c.topics, c.frequency).then(function (res) {
          setStatus(status, res.ok, res.message);
          if (res.ok && !row.contains(unsub)) { row.appendChild(unsub); save.textContent = 'Save changes'; }
        }).catch(function (err) { setStatus(status, false, errorText(err)); })
          .then(function () { save.disabled = false; });
      });
      unsub.addEventListener('click', function () {
        unsub.disabled = true;
        call('unsubscribe', BOOT.token).then(function (res) {
          setStatus(status, res.ok, res.message);
          if (res.ok) { unsub.remove(); save.textContent = 'Subscribe again'; }
        }).catch(function (err) { setStatus(status, false, errorText(err)); })
          .then(function () { unsub.disabled = false; });
      });
    }).catch(function (err) {
      panel.innerHTML = '';
      panel.appendChild(el('p', { class: 'status err', text: errorText(err) }));
    });
  }

  if (BOOT.page === 'confirm') confirmPage();
  else if (BOOT.page === 'manage') managePage();
  else home();
})();
</script>
</body>
</html>
